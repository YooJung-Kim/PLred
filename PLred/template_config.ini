# PLred pipeline config — template
# Copy this file and fill in the values for your observation.
# Blank values use defaults or are ignored.

[Pipeline]
outdir  = processed           # directory for processed outputs; diagnostics/plots go in outdir/plots/

[Instrument]
name                  = FIRSTPL    # FIRSTPL | IRPL (informational; adjust per dataset)
detector              = CRED2      # CRED1 | CRED2 (informational; adjust per dataset)
nfib                  = 38
spectral_orientation  = horizontal # horizontal (FIRSTPL default) | vertical (CRED2)

[Cameras]
fastcam_role  = PSF    # PSF | PL  (which camera provides PSF centroids)

[Sort]
fastcam_dir         =                  # directory with fastcam FITS + .txt files
fastcam_start_time  = 15:05:00         # HH:MM:SS
fastcam_end_time    = 15:06:00
fastcam_dark_file   =                  # blank → use dark_start/end_time
fastcam_dark_start  =
fastcam_dark_end    =
psfcam_dark_file    =                  # optional: dark FITS for the PSF camera
                                       # When PSF is the slow camera, this is
                                       # used to subtract PSF dark during matching.
slowcam_dir         =                  # directory with slowcam .txt files
slowcam_nbin        = 1
crop_width          = 20
apply_dead_time_correction = True
output              = fastcam.h5       # Step 1 output H5 (input for plred-ingest)

[Ingest]
# step1_h5 defaults to [Sort].output if left blank
step1_h5        =                  # override path to Step 1 H5 if needed
plcam_dark      =                  # dark FITS for PLcam; blank = skip dark subtraction
psfcam_dark     =                  # PSF dark (mirrors [Sort].psfcam_dark_file when needed)
plcam_data_dir  =                  # local PLcam FITS directory (for distributed workflows)
                                   # when psfcam_is_fast=False this is the PSFcam directory
slowcam_data_dir =                  # PSFcam FITS directory when PSF is the slow camera
plcam_roi       = 0,412,1100,1120  # y0,y1,x0,x1
output          = alldata.h5

[ROIViewer]
# roi defaults to [Ingest].plcam_roi if left blank
roi             =                  # y0,y1,x0,x1 (leave blank to reuse plcam_roi)
h5_path         = roi.h5           # standalone viewer H5
psf_roi         =                  # optional PSF frame crop y0,y1,x0,x1 (default: full frame)

[Average]
input           = alldata.h5
map_n           = 5
map_width       = 30
xc              =                  # PSFcam grid center x (auto if blank)
yc              =                  # PSFcam grid center y (auto if blank)
pix2mas         = 16.2
time_min        =                  # seconds from start (filter by time)
time_max        =
maxpix_min      =                  # PSF peak flux filter
maxpix_max      =
n_bootstrap     = 0
time_chunk      =                  # seconds per chunk (blank = no chunking, one output file)
output          = map.h5

[WaveSol]
wavsol_file     =                  # wcal.fits or wavsol.npz; blank → pixel coords

[Specextract]
input           = map.h5
extractor       = trace_box        # simple_box | trace_box | simple_optimal | FIRSTPL
truncate        = 0                # remove first/last N spectral channels
output          = couplingmap.fits

# trace_box / simple_box params (ignored for other extractors)
trace_file      = traces.npz

# simple_optimal params
profile_file    = profile.npz

# FIRSTPL params (ignored for box extractors)
model_file      = specmodel/model.npz
var_const       = 200
thresh          = 0.1
nonlin_file     =
