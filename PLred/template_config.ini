# PLred pipeline config — template
# Copy this file and fill in the values for your observation.
# Blank values use defaults or are ignored.
#
# Dark routing (automatic):
#   If Fastcam.type = PSF  → PSF dark subtracted in sort, PL dark subtracted in ingest
#   If Fastcam.type = PL   → PL  dark subtracted in sort, PSF dark subtracted in ingest
#
# Dead-time correction is always applied (not configurable).

[Observation]
obsdate    = 20260530
start_time = 15:05:10
end_time   = 15:05:11

[Fastcam]
type          = PSF             # PSF | PL  — which camera is faster
timestamp_dir = /path/to/fastcam/timestamps/
data_dir      = /path/to/fastcam/data/
dark          = /path/to/fastcam/dark.fits

[Slowcam]
type          = PL              # the other camera
timestamp_dir = /path/to/slowcam/timestamps/
data_dir      = /path/to/slowcam/data/
dark          = /path/to/slowcam/dark.fits
slowcam_nbin  = 1

[ROI]
PLcam_ROI        = 0,412,1200,1220   # y0,y1,x0,x1  crop applied to every PL frame
PSFcam_crop_width = 20               # half-width of PSF centroid stamp (pixels)

[Spectrum]
nfib                 = 38
spectral_orientation = horizontal    # horizontal (FIRSTPL default) | vertical

[ROIViewer]
roi = 0,412,1200,1220                # y0,y1,x0,x1 (leave blank to reuse PLcam_ROI)

[Average]
map_n       = 5
map_width   = 2
xc          =                        # PSFcam grid centre x (auto if blank)
yc          =                        # PSFcam grid centre y (auto if blank)
pix2mas     = 16.2
n_bootstrap = 0
time_min    =                        # seconds from start (optional filter)
time_max    =
maxpix_min  =                        # PSF peak flux filter (optional)
maxpix_max  =

[Specextract]
extractor = trace_box                # simple_box | trace_box | simple_optimal | FIRSTPL
truncate  = 0                        # remove first/last N spectral channels

# trace_box / simple_box params (ignored for other extractors)
trace_file   = traces.npz

# simple_optimal params
profile_file = profile.npz

# FIRSTPL params (ignored for box extractors)
model_file  = specmodel/model.npz
var_const   = 200
thresh      = 0.1
nonlin_file =

[Outputs]
timestamp_match_output = fastcam.h5
ingest_output          = alldata.h5
ROI_viewer_output      = roi.h5
average_output         = map.h5
couplingmap_output     = couplingmap.fits
