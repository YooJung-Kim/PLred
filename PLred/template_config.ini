# PLred pipeline config — template
# Copy this file and fill in the values for your observation.
# Blank values use defaults or are ignored.

[Instrument]
name                  = IRPL       # FIRSTPL | IRPL
detector              = CRED2      # CRED1 | CRED2
nfib                  = 12
spectral_orientation  = vertical   # horizontal (default) | vertical (CRED2)

[Cameras]
fastcam_role  = PSF    # PSF | PL  (which camera provides centroids for spatial binning)
slowcam_role  = PL     # PL  | PSF

[Ingest]
step1_h5        = fastcam.h5       # from plred-sort (or transferred from Computer A)
plcam_dark      =                  # dark FITS for PLcam
plcam_data_dir  =                  # local PLcam FITS directory (for distributed workflows)
plcam_roi       = 0,412,1100,1120  # y0,y1,x0,x1
output          = alldata.h5

[ROIViewer]
roi             = 0,412,1100,1120  # y0,y1,x0,x1 (same as plcam_roi)
h5_path         = roi.h5           # standalone viewer H5 (includes PSF frames + metadata)
psf_roi         =                  # optional PSF frame crop y0,y1,x0,x1 (default: full frame)

[Average]
input           = alldata.h5
map_n           = 5
map_width       = 30
xc              =                  # PSFcam grid center x (auto if blank)
yc              =                  # PSFcam grid center y (auto if blank)
pix2mas         = 16.2
time_min        =                  # seconds from start (filter by time)
time_max        =
maxpix_min      =                  # PSF peak flux filter
maxpix_max      =
n_bootstrap     = 0
output          = map.h5

[WaveSol]
wavsol_file     =                  # wcal.fits or wavsol.npz; blank → pixel coords

[Specextract]
input           = map.h5
extractor       = simple_box       # simple_box | trace_box | simple_optimal | FIRSTPL
output          = couplingmap.fits
plcam_roi       = 0,412,1100,1120

# simple_box / trace_box params (ignored for other extractors)
trace_file      = traces.npz

# simple_optimal params
profile_file    = profile.npz

# FIRSTPL params (ignored for box extractors)
model_file      = specmodel/model.npz
var_const       = 200
thresh          = 0.1
nonlin_file     =
