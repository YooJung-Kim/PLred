# Template configuration file for IRPLred Mode 2: Time-series spectral extraction
# Copy this file and customize for your data

[Input]
# Raw PL detector FITS files directory
plcam_dir = /path/to/raw/pl_spectra/
plcam_header = apapane_
plcam_footer = .fits.gz

# PSF camera (tracking camera) data
# These should be generated by PLred.sort.script_match_timestamps() or FrameSorter.match_frames()
psf_matched_frames_file = /path/to/timestamp_matching_output/palila_matched_frames.npy
psf_matched_metadata_file = /path/to/timestamp_matching_output/palila_matched.pkl

# Dark frames (optional)
# Set to empty string to skip dark subtraction
pl_dark_file = /path/to/dark_frames/dark_pl.fits

# Observation time window (used to filter input files)
obs_start = 13:02:10
obs_end = 14:10:00

[Spectral_Extraction]
# Spectrum locations on detector (Y-coordinates in pixels)
# Options:
#   auto                    - Auto-detect locations using locate_spectra()
#   [50, 150, 250, ...]    - Fixed list of Y-coordinates
spectrum_locations = auto

# Box extraction width (half-width in pixels around spectrum center)
extraction_width = 6

# Apply dark frame subtraction during extraction
apply_dark_subtraction = True

[Detector]
# IR detector parameters (these can override defaults from parameters.py)
nfib = 38
detector_height = 384
detector_width = 512
plate_scale_mas = 20.0

# Wavelength calibration (linear interpolation between min/max)
wavelength_min_um = 1.1
wavelength_max_um = 1.8

[Metadata]
# File classification according to data schema
# Options: onsky-sci, onsky-cal, bench, simulation
file_type = onsky-sci

# Dataset and target identifiers
dataset_name = WR140
target_name = WR140

# Instrument configuration
pl_backend = IR
tracking_camera = palila

# Calibration flags (auto-detected when possible, can override here)
nonlinearity_correction = False
extraction_method = box

[Output]
# Output filename (will be suffixed with _mode2.h5)
output_name = WR140_mode2

# Output directory (created if not exists)
output_dir = ./data/processed/

# HDF5 compression settings
compression = gzip
compression_level = 4
chunk_size_time = 100

[Options]
# Display progress bars during processing
show_progress = True

# Verbose printout
verbose = True
