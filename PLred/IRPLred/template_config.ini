# IRPLred Time-Series Data Reduction Pipeline Configuration
# Unified configuration file for all 3 pipeline steps:
# 1. Timestamp Matching (PSF ↔ PL cameras)
# 2. Spectral Extraction (FITS → _spec.FITS)
# 3. Final Ingest (combined → .h5)
#
# Copy this file and customize for your data

[Input]
# === STEP 1: Timestamp Matching ===
# PSF (tracking) camera data directory
psf_dir = /path/to/raw/psf_fits/
psf_header = palila_

# PL (spectrometer) camera data directory
pl_dir = /path/to/raw/pl_fits/
pl_header = apapane_

# Observation time window (HH:MM:SS format)
obs_start = 13:02:10
obs_end = 14:10:00

# === STEP 2: Spectral Extraction ===
# Spectrum locations on detector (Y-coordinates in pixels)
# Options:
#   auto                    - Auto-detect locations using locate_spectra()
#   [50, 150, 250, ...]    - Fixed list of Y-coordinates
spectrum_locations = auto

# Box extraction half-width (pixels)
extraction_width = 6

# Dark frame for subtraction (optional, leave empty to skip)
pl_dark_file =

[Spectral_Extraction]
# (Legacy section name, kept for backward compatibility)
# Spectrum locations on detector
spectrum_locations = auto

# Box extraction width (half-width in pixels around spectrum center)
extraction_width = 6

# Apply dark frame subtraction during extraction
apply_dark_subtraction = True

[Detector]
# IR detector parameters (these are defaults; can override here)
nfib = 38
detector_height = 384
detector_width = 512

# Plate scale (PSF camera, for metadata)
plate_scale_mas = 20.0

# Wavelength range for linear interpolation
wavelength_min_um = 1.1
wavelength_max_um = 1.8

[Metadata]
# === STEP 3: Final Ingest ===
# Data classification
file_type = onsky-sci  # Options: onsky-sci, onsky-cal, bench, simulation

# Dataset and target identifiers
dataset_name = WR140
target_name = WR140

# Instrument configuration
pl_backend = IR
tracking_camera = palila

# Calibration metadata
nonlinearity_correction = False
extraction_method = box

[Ingest]
# Output filename (suffix .h5 will be added automatically)
dataset_name = WR140

# Output directory
output_dir = ./data/processed/

[Error_Tolerance]
# === ERROR HANDLING & TOLERANCES ===
# Minimum frames required after timestamp matching
# (pipeline aborts if fewer than this)
min_matched_frames = 100

# Timestamp matching tolerance in seconds
# (exact match if 0.0)
timestamp_tolerance_sec = 0.1

# Behavior if dark file is missing/unreadable
# Options: skip (use no dark), warn (proceed with warning), error (abort)
dark_missing_behavior = warn

# Behavior if spectral extraction encounters warnings
# Options: skip, warn, error
extraction_error_behavior = warn

[Pipeline]
# === PIPELINE CONTROL ===
# Keep intermediate files (_match.h5 and _spec.fits) after final ingest
save_intermediates = True

# Show progress bars during processing
show_progress = True

# Verbose logging output
verbose = True

# Maximum number of FITS files to process per batch (0 = no limit)
batch_size = 0

[Options]
# (Legacy section name, kept for backward compatibility)
show_progress = True
verbose = True
