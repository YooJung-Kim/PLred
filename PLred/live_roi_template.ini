# plred-live-roi config — PLcam (slowcam) machine
# Copy this file and fill in for your observation target.
# Usage: plred-live-roi my_target_roi.ini

[ROI]
outpath     = live_roi.h5
roi         = 800,1200,1234,1235   # y0,y1,x0,x1  global PLcam pixel coords
obs_start   = 12:00:00             # HH:MM:SS
obs_end     = 12:30:00
poll_sec    = 2

[Slowcam]
local_dir   = /data/firstpl/       # PLcam FITS files are here locally

[MatchResults]
remote_host =                      # fastcam machine hostname; blank = local only
remote_user =
remote_dir  =                      # match_results/ directory on fastcam machine
local_dir   = incoming/match_results/   # where rsynced .npz files land

[LivePixels]
# Global PLcam pixel coordinates for response map display (py, px, label)
# One entry per line. Leave blank to configure in the viewer.
pixels      =
#    900,1234,trace_center
#    901,1234,trace_plus1
#    902,1234,trace_plus2
