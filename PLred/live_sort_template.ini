# plred-live-sort config — fastcam (PSFcam) machine
# Copy this file and fill in for your observation target.
# Usage: plred-live-sort my_target_sort.ini

[Sort]
obs_start   = 12:00:00    # HH:MM:SS — ignore files before this time
obs_end     = 12:30:00    # HH:MM:SS — ignore files after this time
poll_sec    = 2
crop_width  = 20          # px around PSF centre to keep (blank = full frame)
dark_file   =             # PSFcam dark FITS; blank = skip dark subtraction
apply_dead_time_correction = True

[Fastcam]
local_dir   = /data/palila/   # PSFcam FITS + .txt files are here locally

[Slowcam]
remote_host =                 # PLcam machine hostname; blank = no rsync (local only)
remote_user =                 # SSH user on PLcam machine
remote_dir  =                 # directory on PLcam machine containing slowcam .txt files
local_dir   = incoming/slowcam/   # where rsynced slowcam .txt files land

[Output]
local_dir   = match_results/  # where .npz match result files are written
remote_host =                 # PLcam machine; blank = skip rsync of results
remote_user =
remote_dir  =                 # incoming match-result directory on PLcam machine
